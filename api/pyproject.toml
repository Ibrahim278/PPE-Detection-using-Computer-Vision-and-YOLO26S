[project]
name = "ppe-api"
version = "0.1.0"
description = "FastAPI backend for PPE compliance monitoring (image, video jobs, live stream)"
requires-python = ">=3.10"
dependencies = [
    "ppe",                       # ../ml (install with: pip install -e ../ml)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
platforms = ["yt-dlp>=2024.1.0"]   # YouTube / Vimeo URLs
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
